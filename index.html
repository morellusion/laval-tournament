<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Laval Provincial Tournament Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,700;1,800&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: slanted purple masthead with the tournament crest, sticky tab bar, then one view at a time (overview, schedule, standings, stats, team, game). Palette comes from the crest: violet, black, silver. */
:root{
  --bg:#f3f2f7; --surface:#ffffff; --ink:#16111f; --muted:#5f5a6e; --line:#d9d6e3;
  --violet:#5b3a9e; --violet-soft:#ece8f7; --silver:#c9ccd6; --good:#1d7a4d; --warn:#a85d00;
  --hero:#1a1230; --hero-ink:#ffffff; --hero-accent:#a98bf0; --plate:#f1f0f6;
  --display:'Barlow Condensed','Arial Narrow',sans-serif; --body:'Barlow',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0a16;--surface:#181224;--ink:#ece9f4;--muted:#9d97b0;--line:#2c2440;--violet:#a98bf0;--violet-soft:#241a3d;--silver:#5c5a6b;--good:#4cc48a;--warn:#f0a548;--hero:#1a1230;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e0a16;--surface:#181224;--ink:#ece9f4;--muted:#9d97b0;--line:#2c2440;--violet:#a98bf0;--violet-soft:#241a3d;--silver:#5c5a6b;--good:#4cc48a;--warn:#f0a548;--hero:#1a1230;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;margin:0;padding-block:0 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:var(--violet);text-decoration-thickness:1px;text-underline-offset:2px}
a:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto}
.disp{font-family:var(--display);font-style:italic;font-weight:800;text-transform:uppercase;letter-spacing:.01em}
/* masthead */
.mast{margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));background:var(--hero);color:var(--hero-ink);
  clip-path:polygon(0 0,100% 0,100% calc(100% - 26px),0 100%);padding-block:30px 58px}
.mast .wrap{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.plate{background:var(--plate);padding:8px 14px;clip-path:polygon(10% 0,100% 0,90% 100%,0 100%);flex:none}
.plate img{display:block;height:96px;width:auto}
.mast h1{margin:0;font-size:clamp(30px,5.4vw,54px);line-height:.98;text-wrap:balance}
.mast .eyebrow{font:600 13px var(--display);letter-spacing:.16em;text-transform:uppercase;color:var(--hero-accent);margin-bottom:6px}
.mast .sub{margin-top:10px;color:#cfc8e3;display:flex;flex-wrap:wrap;gap:2px 16px;font-size:14px}
.mtxt{min-width:0;flex:1 1 320px}
/* tabs */
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin-top:-14px;border-bottom:1px solid var(--line);
  margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
nav .wrap{display:flex;gap:4px;overflow-x:auto}
nav a{font:700 17px var(--display);font-style:italic;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);text-decoration:none;padding:12px 14px;border-bottom:3px solid transparent;white-space:nowrap}
nav a[aria-current="page"]{color:var(--ink);border-color:var(--violet)}
nav a:hover{color:var(--ink)}
main{padding-top:28px}
h2{font:800 italic 28px var(--display);text-transform:uppercase;margin:36px 0 12px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
h2:first-child{margin-top:0}
h2 small{font:500 14px var(--body);text-transform:none;font-style:normal;color:var(--muted)}
h3{font:700 16px var(--display);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0 0 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:3px}
.scroll{overflow-x:auto}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:20px}
.grid2>*{min-width:0}
/* progression */
.prog{display:grid;grid-template-columns:repeat(3,1fr);gap:0}
.phase{padding:16px 18px;border-right:1px solid var(--line);position:relative;min-width:0}
.phase:last-child{border-right:0}
.phase .lab{font:700 13px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.phase .big{font:800 italic 34px/1.05 var(--display);font-variant-numeric:tabular-nums;margin:2px 0 8px}
.phase .big small{font:500 15px var(--body);font-style:normal;color:var(--muted)}
.bar{height:6px;background:var(--violet-soft);border-radius:0;overflow:hidden}
.bar i{display:block;height:100%;background:var(--violet)}
.phase.on{background:var(--violet-soft)}
.phase .when{color:var(--muted);font-size:13px;margin-top:8px}
@media(max-width:640px){.prog{grid-template-columns:1fr}.phase{border-right:0;border-bottom:1px solid var(--line)}.phase:last-child{border-bottom:0}}
.days{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px;margin-top:16px}
.day{background:var(--surface);border:1px solid var(--line);padding:9px 10px;text-decoration:none;color:var(--ink);border-radius:3px;display:block}
.day b{font:700 17px var(--display);font-style:italic;text-transform:uppercase;display:block}
.day span{color:var(--muted);font-size:13px}
.day.today{border-color:var(--violet);box-shadow:inset 0 3px 0 var(--violet)}
.day.done{background:var(--violet-soft)}
.day.ko b{color:var(--violet)}
/* game rows */
.gl{list-style:none;margin:0;padding:0}
.gr{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);text-decoration:none;color:var(--ink)}
.gl li:first-child .gr{border-top:0}
.gr:hover{background:var(--violet-soft)}
.gr .t{font:700 18px var(--display);font-variant-numeric:tabular-nums;line-height:1.1}
.gr .t small{display:block;font:500 12px var(--body);color:var(--muted)}
.gr .tm{min-width:0}
.gr .tm div{display:flex;justify-content:space-between;gap:10px;font-weight:600;overflow-wrap:anywhere}
.gr .tm div.ph{color:var(--muted);font-weight:500}
.gr .tm .sc{font:800 italic 20px var(--display);font-variant-numeric:tabular-nums}
.gr .tm .win{color:var(--violet)}
.chip{font:700 11px var(--display);letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;background:var(--violet-soft);color:var(--muted);border-radius:2px;white-space:nowrap}
.chip.played{background:var(--violet);color:var(--surface)}
.chip.live{background:#c62828;color:#fff}
.chip.ko{background:var(--hero);color:#fff}
@media(max-width:480px){.gr{grid-template-columns:58px 1fr}.gr .chip{display:none}}
/* bracket */
.bracket{display:grid;grid-template-columns:1fr auto 1fr;gap:0 20px;align-items:center}
.col{display:flex;flex-direction:column;gap:26px;min-width:0}
.mu{display:block;text-decoration:none;color:var(--ink)}
.mu .mh{display:flex;justify-content:space-between;gap:8px;font:700 12px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.mu .rows{display:flex;flex-direction:column;gap:3px;filter:drop-shadow(0 1px 0 var(--line))}
.bar{display:grid;grid-template-columns:46px minmax(0,1fr) auto;min-height:54px;background:var(--surface);clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,0 100%)}
.bar .seed{background:var(--hero);color:#fff;display:flex;align-items:center;justify-content:center;font:800 italic 22px var(--display)}
.bar .seed.w{font-size:15px}
.bar .pts{min-width:62px}
.bar .who{padding:6px 24px 6px 10px;display:flex;align-items:center;min-width:0;font-weight:600;overflow-wrap:anywhere;line-height:1.2}
.bar.ph .who{color:var(--muted);font-weight:500}
.bar .who em{display:block;font:600 11px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--warn);font-style:normal}
.bar .pts{background:var(--hero);color:#b9b0d4;display:flex;align-items:center;justify-content:center;padding-right:12px;font:800 italic 26px var(--display);font-variant-numeric:tabular-nums}
.bar.win .who{color:var(--violet);font-weight:700}
.bar.win .pts{background:var(--violet);color:var(--surface)}
.bar.lose .who{color:var(--muted)}
.mu:hover .bar .seed{background:var(--violet);color:var(--surface)}
.mu.fin .bar{min-height:64px}
.mu.fin .bar .seed{background:var(--violet);color:var(--surface)}
.mu.fin .mh{color:var(--violet)}
.cats{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.cats a{font:800 italic 16px var(--display);letter-spacing:.06em;text-transform:uppercase;text-decoration:none;color:var(--hero-ink);border:1.5px solid var(--hero-accent);padding:5px 16px;border-radius:99px;opacity:.8}
.cats a[aria-current="page"]{background:var(--hero-accent);color:var(--hero);opacity:1}
.cats a:focus-visible{outline:2px solid var(--hero-ink);outline-offset:2px}
.bracket.r3{grid-template-columns:1fr auto 1fr auto 1fr}
.divh{margin-top:14px}
.advance{font:800 italic 34px/1 var(--display);color:var(--violet);text-align:center}
.advance small{display:block;font:700 11px var(--display);font-style:normal;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:4px}
@media(max-width:759px){.bracket,.bracket.r3{grid-template-columns:1fr;gap:14px}.advance .ar{display:inline-block;transform:rotate(90deg)}}
.note{background:var(--violet-soft);border-left:3px solid var(--violet);padding:10px 14px;color:var(--muted);font-size:14px;margin-top:16px}
/* tables */
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:9px 12px;text-align:left;white-space:nowrap}
th{font:700 12px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:var(--violet-soft);border-bottom:1px solid var(--line)}
td{border-top:1px solid var(--line)}
tr:first-child td{border-top:0}
.n{text-align:right}
td.team{white-space:normal;min-width:190px;font-weight:600}
td.rk{font:800 italic 20px var(--display);color:var(--violet);width:44px}
tr.q td{background:color-mix(in srgb,var(--violet-soft) 60%,transparent)}
tr.q td.rk::after{content:" ▸";font-size:12px}
tr.hl td{background:color-mix(in srgb,var(--violet) 22%,var(--surface));font-weight:700}
tr.hl td:first-child{box-shadow:inset 4px 0 0 var(--violet)}
.legend{color:var(--muted);font-size:13px;margin-top:8px}
/* game detail */
.back{display:inline-block;margin-bottom:14px;font-weight:600}
.board{background:var(--hero);color:#fff;padding:22px 20px;clip-path:polygon(0 0,100% 0,100% 100%,2% 100%,0 calc(100% - 14px))}
.board .meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 16px;font:700 13px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--hero-accent)}
.board .vs{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center;margin-top:12px}
.board .tn{font:800 italic clamp(20px,3.4vw,32px)/1.05 var(--display);text-transform:uppercase;overflow-wrap:anywhere}
.board .tn small{display:block;font:600 12px var(--display);font-style:normal;letter-spacing:.14em;color:#b9b0d4;margin-top:4px}
.board .tn.r{text-align:right}
.board .big{font:800 italic clamp(40px,8vw,72px)/1 var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.board .big.tbd{font-size:30px;color:#b9b0d4}
@media(max-width:560px){.board .vs{grid-template-columns:1fr;text-align:center}.board .tn.r{text-align:center}}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:0}
.fact{padding:12px 16px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0}
.fact b{display:block;font:700 12px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.empty{padding:22px 18px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font:700 italic 20px var(--display);text-transform:uppercase;margin-bottom:2px}
.ev{display:grid;grid-template-columns:64px 30px 1fr;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.ev:first-child{border-top:0}
.ev .lg{display:block}
.ev .tt{font:700 15px var(--display);color:var(--muted);font-variant-numeric:tabular-nums}
.ev small{color:var(--muted);display:block}
.ros{columns:2 200px;column-gap:20px;padding:6px 14px 12px;margin:0;list-style:none}
.ros li{padding:4px 0;border-bottom:1px dotted var(--line);break-inside:avoid}
.ros b{display:inline-block;width:2.2em;color:var(--violet);font-family:var(--display);font-style:italic}
.ros span{color:var(--muted);font-size:12px;margin-left:6px}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
select{font:500 15px var(--body);background:var(--surface);color:var(--ink);border:1px solid var(--line);padding:8px 10px;border-radius:3px;max-width:100%}
.foot{margin-top:48px;color:var(--muted);font-size:13px}
.strip{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x proximity;padding:8px 2px 14px;margin:0 -2px;scrollbar-width:thin}
.sc-card{flex:none;width:208px;scroll-snap-align:center;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--silver);border-radius:3px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;position:relative;transition:transform .15s,box-shadow .15s}
.sc-card:hover{transform:translateY(-2px);box-shadow:0 6px 16px color-mix(in srgb,var(--ink) 14%,transparent)}
.sc-card .hd{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;padding:10px 12px 8px}
.sc-card .dy{font:700 12px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);line-height:1.1}
.sc-card .dy b{display:block;font:800 italic 20px var(--display);letter-spacing:.02em;color:var(--ink);margin-top:1px}
.sc-card .hr{font:800 italic 24px/1 var(--display);color:var(--violet);font-variant-numeric:tabular-nums;white-space:nowrap}
.sc-card .tt{display:grid;grid-template-columns:28px minmax(0,1fr) auto;align-items:center;gap:9px;padding:7px 12px;min-height:46px;border-top:1px solid var(--line)}
.sc-card .tt .nm{font-size:13.5px;font-weight:600;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.sc-card .tt.ph .nm{color:var(--muted);font-weight:500}
.sc-card .tt .sq{min-width:30px;height:30px;padding:0 6px;display:flex;align-items:center;justify-content:center;background:var(--hero);color:#fff;font:800 italic 20px var(--display);font-variant-numeric:tabular-nums}
.sc-card .tt.win .sq{background:var(--violet);color:var(--surface)}
.sc-card .tt.win .nm{font-weight:700}
.sc-card .tt.lose .nm{color:var(--muted)}
.sc-card .ft{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 12px;border-top:1px solid var(--line);background:var(--violet-soft);font:700 11px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.sc-card .ft span:last-child{margin-left:auto}
.sc-card.done{border-top-color:var(--hero)}
.sc-card.done:not(.next){opacity:.5;transition:opacity .15s}
.sc-card.done:not(.next):hover,.sc-card.done:not(.next):focus-visible{opacity:1}
.sc-card.ko{border-top-color:var(--red)}
.sc-card.next{border-color:var(--violet);border-top-color:var(--violet);box-shadow:0 8px 20px color-mix(in srgb,var(--violet) 28%,transparent)}
.sc-card.next .ft{background:var(--violet);color:var(--surface)}
.livebar{margin-top:14px;display:flex;align-items:center;justify-content:center;gap:8px;background:#c62828;color:#fff;padding:8px 12px;font:800 15px var(--display);letter-spacing:.14em;text-transform:uppercase}
.livebar small{font:600 12px var(--body,inherit);letter-spacing:.04em;text-transform:none;opacity:.9}
.livebar i{width:10px;height:10px;border-radius:50%;background:#fff;animation:lvp 1.4s ease-in-out infinite}
@keyframes lvp{50%{opacity:.25}}
@media(prefers-reduced-motion:reduce){.livebar i{animation:none}}
.pr.live{box-shadow:inset 4px 0 0 #c62828}
.pr .lvt{background:#c62828;color:#fff;padding:1px 6px;border-radius:2px;font-weight:700}
.sc-card.live,.sc-card.live.next{border:2px solid #c62828;border-top:4px solid #c62828;box-shadow:0 8px 20px rgba(198,40,40,.3)}
.sc-card.live .ft,.sc-card.live.next .ft{background:#c62828;color:#fff}
.stripcap{font:700 13px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 2px}
.feed{list-style:none;margin:0;padding:0}
.feed li{border-top:1px solid var(--line)}
.feed li:first-child{border-top:0}
.feed a.fi{display:flex;gap:12px;align-items:flex-start;padding:11px 14px;color:var(--ink);text-decoration:none}
.feed a.fi:hover{background:var(--violet-soft)}
.feed .pill{flex:none;min-width:84px;text-align:center;font:700 11px var(--display);letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:2px;background:var(--line);color:var(--muted);margin-top:2px}
.feed .pill.nx{background:var(--violet);color:var(--surface)}
.feed .pill.hl{background:var(--violet-soft);color:var(--violet)}
.feed .tx{flex:1;min-width:0;font-size:14px;line-height:1.35}
.feed small{display:block;color:var(--muted);margin-top:2px}
.more{display:block;width:100%;font:600 14px var(--body);color:var(--violet);background:none;border:0;border-top:1px solid var(--line);padding:11px;cursor:pointer}
.more:hover{background:var(--violet-soft)}
.sortb{all:unset;cursor:pointer;display:inline-flex;gap:4px;align-items:center;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit}
.sortb:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
th[aria-sort] .sortb{color:var(--violet)}
.ptbl td.num,.ptbl td.pl{font-weight:600}
.ptbl td.no{color:var(--violet);font:800 italic 16px var(--display);width:46px}
.ptbl td.tm{color:var(--muted);white-space:normal;min-width:150px;font-size:14px}
.pnote{color:var(--muted);font-size:13px;margin-top:8px}
.share{align-self:center;flex:none;font:700 14px var(--display);letter-spacing:.08em;border:1px solid var(--violet);background:var(--violet);color:#fff;padding:5px 14px;border-radius:99px;cursor:pointer;margin-left:8px;white-space:nowrap}
.share:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
.pcard{margin-bottom:14px}
.pch{padding:10px 14px 0;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.pch small{color:var(--muted);font-size:13px}
.champ{display:flex;gap:12px;align-items:center;padding:12px 14px;background:var(--violet-soft);border-top:1px solid var(--line);margin-top:8px}
.champ .tx{flex:1;min-width:0}.champ b{font-size:17px}.champ small,.pk small{display:block;color:var(--muted);font-size:13px;line-height:1.35}
.champ .big{font:800 italic 26px var(--display);color:var(--violet)}
.pk{display:flex;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.pk .tx{flex:1;min-width:0}.pk .big{font:800 italic 20px var(--display);color:var(--violet)}
.pr{display:block;padding:11px 14px;color:var(--ink);text-decoration:none;border-top:1px solid var(--line)}
.pr:first-child{border-top:0}.pr:hover{background:var(--violet-soft)}
.pr .pn{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-bottom:6px}.pr .pn b{min-width:0}.pr .pn span{color:var(--muted);flex:none}
.pbar{display:flex;height:22px;border-radius:2px;overflow:hidden;font:700 12px var(--display);letter-spacing:.04em}
.pbar span{display:grid;place-items:center;min-width:0;overflow:hidden;white-space:nowrap}
.pbar .ph{background:var(--violet);color:#fff}.pbar .pt_{background:var(--silver);color:#fff}.pbar .pa{background:var(--ink);color:var(--bg)}
.pr small{display:block;color:var(--muted);margin-top:5px}
.ptour{display:grid;grid-template-columns:minmax(0,1fr) 60px 60px 66px;gap:6px;align-items:center;padding:7px 14px;border-top:1px solid var(--line);font-size:14px}
.ptour.hd{border-top:0;font:700 11px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ptour .n{text-align:right;font-variant-numeric:tabular-nums;line-height:1.15}.ptour .n b{display:block}.ptour .n i{display:block;font-style:normal;font-size:11px;color:var(--muted)}
.ptour .n.k b{font-weight:800;color:var(--violet)}
.up{color:var(--good)}.dn{color:var(--warn)}
details.pd{border-top:1px solid var(--line)}
details.pd>summary{list-style:none;cursor:pointer;border-top:0}
details.pd>summary::-webkit-details-marker{display:none}
details.pd>summary:hover{background:var(--violet-soft)}
details.pd>summary:focus-visible{outline:2px solid var(--violet);outline-offset:-2px}
details.pd>summary .tl>span::before{content:'▸';display:inline-block;width:14px;color:var(--violet)}
details.pd[open]>summary .tl>span::before{content:'▾'}
.pwhy{padding:4px 14px 14px 28px;font-size:14px;line-height:1.45;background:var(--violet-soft)}
.pwhy h4{font:700 12px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--violet);margin:12px 0 4px}
.pwhy p{margin:0 0 4px}.pwhy ul{margin:0;padding:0;list-style:none}
.pwhy li{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-top:1px solid var(--line)}
.pwhy li:first-child{border-top:0}.pwhy li span:last-child{color:var(--muted);text-align:right;flex:none}
.pwhy .pm{color:var(--muted);font-size:13px}
.pwhy a{color:var(--violet);font-weight:700}
.pnote2{color:var(--muted);font-size:13px;padding:9px 14px;border-top:1px solid var(--line)}
.lang{margin-left:auto;align-self:center;flex:none;font:700 14px var(--display);letter-spacing:.1em;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:5px 12px;border-radius:99px;cursor:pointer}
.lang:hover{border-color:var(--violet);color:var(--violet)}
.pill{display:inline-block;margin-right:6px}
.lg{width:var(--s,28px);height:var(--s,28px);object-fit:contain;flex:none;display:inline-block;vertical-align:middle}
.lg.empty{border:1px dashed var(--line);border-radius:50%}
.tl{display:inline-flex;align-items:center;gap:10px;min-width:0}
.board .lgw{background:var(--plate);display:inline-flex;padding:6px 12px;clip-path:polygon(12% 0,100% 0,88% 100%,0 100%);margin-bottom:8px}
.board .tn.r .lgw{clip-path:polygon(0 0,88% 0,100% 100%,12% 100%)}

  const tab=(title,rows,cols)=>`<div class="card scroll"><div style="padding:10px 14px 0"><h3>${title}</h3></div>${rows.length?`<table>${rows.map((r,i)=>`<tr><td class="rk">${i+1}</td><td class="team">${esc(P[r.id])}<small style="display:block;color:var(--muted);font-weight:400">${esc(tn(r.t))}</small></td>${cols(r).map(v=>`<td class="n">${v}</td>`).join('')}</tr>`).join('')}</table>`:`<div class="empty">${t().noEntries}</div>`}</div>`;
  const top=f=>L.filter(r=>f(r)>0).sort((a,b)=>f(b)-f(a)||(b.g-a.g)).slice(0,8);
  const tstats=ST.map(r=>`<tr><td class="team"><a href="#team-${r.id}" style="color:inherit;text-decoration:none" class="tl">${lg(r.id,24)}<span>${esc(tn(r.id))}</span></a></td>${[r.gp,r.gf,r.ga,r.gf-r.ga>0?'+'+(r.gf-r.ga):r.gf-r.ga,r.pim].map(v=>`<td class="n">${v}</td>`).join('')}</tr>`).join('');
  return `${predSection()}
  <h2>${t().leaders}</h2><div class="grid2">${tab(t().lGoals,top(r=>r.g),r=>[r.g])}${tab(t().lPoints,top(r=>r.g+r.a),r=>LANG==='fr'?[r.g+' B',r.a+' P',r.g+r.a]:[r.g+' G',r.a+' A',r.g+r.a])}${tab(t().lPim,top(r=>r.pim),r=>[r.pen+' '+t().pen,r.pim+' '+t().min])}</div>
  <h2>${t().playerStats}</h2><div class="filters"><select id="pteam" aria-label="${t().filterTeam}"><option value="">${t().allTeamsP}</option>${Object.entries(T).sort((a,b)=>a[1].localeCompare(b[1])).map(([id,n])=>`<option value="${id}">${esc(n)}</option>`).join('')}</select></div><div id="pst"></div>
  <h2>${t().teamStats}</h2><div class="card scroll"><table><tr><th>${t().team}</th>${t().teamCols.map(h=>`<th class="n">${h}</th>`).join('')}</tr>${tstats}</table></div>`;
}
let PSORT={sk:{k:'pts',d:-1},gl:{k:'gaa',d:1}};
function playerRows(){
  const M={};
  const get=(id,tm_)=>M[id]??={id,t:tm_,no:null,pos:null,games:new Set(),g:0,a:0,pim:0};
  G.forEach(g=>{
    g.lineup.forEach(l=>{const r=get(l.pl,l.t);r.no=l.no;r.pos=l.pos;if(played(g))r.games.add(g.n)});
    g.goals.forEach(x=>{const r=get(x.s,x.t);r.g++;r.games.add(g.n);x.a.forEach(a=>{const q=get(a,x.t);q.a++;q.games.add(g.n)})});
    g.pens.forEach(x=>{const r=get(x.pl,x.t);r.pim+=x.min;r.games.add(g.n)});
  });
  const rows=Object.values(M).map(r=>({...r,gp:r.games.size,pts:r.g+r.a}));
  const goalies=rows.filter(r=>r.pos==='G').map(r=>{
    let ga=0,ok=true,so=0;
    [...r.games].forEach(n=>{const g=byN[n];if(!g||!played(g)||!g.home||!g.away){return}
      const gs=g.lineup.filter(l=>l.t===r.t&&l.pos==='G');
      if(gs.length!==1){ok=false;return}
      const against=g.score[g.home===r.t?'away':'home'];ga+=against;if(against===0)so++});
    return {...r,ga:ok?ga:null,so:ok?so:null,gaa:ok&&r.gp?ga/r.gp:null};
  });
  return {sk:rows.filter(r=>r.pos!=='G'),gl:goalies};
}
function fillPlayers(){
  const box=$('pst');if(!box)return;
  const draw=()=>{
    const tf=$('pteam').value,R=playerRows();
    const sk=R.sk.filter(r=>!tf||r.t===tf),gl=R.gl.filter(r=>!tf||r.t===tf);
    const table=(kind,rows,cols,keys,cname)=>{
      const st=PSORT[kind];
      const val=(r,k)=>r[k]==null?(k==='gaa'||k==='ga'||k==='so'?(st.d>0?Infinity:-Infinity):0):r[k];
      rows=[...rows].sort((a,b)=>{const x=val(a,st.k),y=val(b,st.k);
        if(typeof x==='string'||typeof y==='string')return String(x).localeCompare(String(y))*st.d;
        return (x-y)*st.d||(b.g-a.g)||(b.a-a.a)||String(P[a.id]).localeCompare(String(P[b.id]))});
      const th=keys.map(k=>{const txt=cols[k],num=!['no','pl','tm'].includes(k),on=st.k===k;
        return `<th class="${num?'n':''}" ${on?`aria-sort="${st.d>0?'ascending':'descending'}"`:''}><button type="button" class="sortb" data-kind="${kind}" data-k="${k}" aria-label="${t().sortBy} ${txt}">${txt}${on?(st.d>0?' ▲':' ▼'):''}</button></th>`}).join('');
      const fmt=(r,k)=>k==='gaa'?(r.gaa==null?'–':r.gaa.toFixed(2)):(r[k]==null?'–':r[k]);
      const body=rows.map(r=>`<tr><td class="no">${r.no??''}</td><td class="pl">${esc(P[r.id])}</td><td class="tm"><span class="tl">${lg(r.t,20)}<span>${esc(tn(r.t))}</span></span></td>${keys.slice(3).map(k=>`<td class="n ${k==='pts'||k==='gaa'?'num':''}">${fmt(r,k)}</td>`).join('')}</tr>`).join('');
      return `<div class="card scroll"><div style="padding:10px 14px 0"><h3>${cname}</h3></div>${rows.length?`<table class="ptbl"><tr>${th}</tr>${body}</table>`:`<div class="empty">${t().noPlayers}</div>`}</div>`};
    box.innerHTML=table('sk',sk,t().pCols,['no','pl','tm','gp','g','a','pts','pim'],t().skaters)+'<div style="height:16px"></div>'+table('gl',gl,t().gCols,['no','pl','tm','gp','ga','gaa','so'],t().goalies)+`<div class="pnote">${t().gNote}</div>`;
    box.querySelectorAll('.sortb').forEach(b=>b.onclick=()=>{const st=PSORT[b.dataset.kind],k=b.dataset.k;
      if(st.k===k)st.d=-st.d;else{st.k=k;st.d=['pl','tm','no','ga','gaa'].includes(k)?1:-1}draw()});
  };
  $('pteam').onchange=draw;draw();
}
function teamView(id){
  if(!T[id])return notFound();
  const SD=STD[Math.max(0,DIVS.indexOf(D.div[id]||null))]||ST,r=SD.find(x=>x.id===id),rank=SD.indexOf(r)+1,list=G.filter(g=>g.home===id||g.away===id);
  const ro={};G.forEach(g=>g.lineup.filter(l=>l.t===id).forEach(l=>ro[l.pl]=l));
  const rl=Object.values(ro).sort((a,b)=>a.no-b.no);
  const rec=LANG==='fr'?`${r.w} V ${r.l} D ${r.t} N`:`${r.w}W ${r.l}L ${r.t}T`;
  return `<a class="back" href="#overview">${t().back}</a><h2>${lg(id,56)} ${esc(tn(id))} <small>${t().rank(rank)} · ${rec} · ${r.pts} ${t().pts}</small></h2>
  <div class="card"><ul class="gl">${list.map(g=>rowHTML(g,true)).join('')}</ul></div>
  <h2>${t().roster}</h2><div class="card">${rl.length?`<ul class="ros">${rl.map(l=>`<li><b>#${l.no}</b>${esc(P[l.pl])}<span>${l.pos}</span></li>`).join('')}</ul>`:`<div class="empty"><b>${t().noRoster}</b>${t().noRosterTip}</div>`}</div>`;
}
function gameView(n){
  const g=byN[n];if(!g)return notFound();
  const h=slotName(g,'home'),a=slotName(g,'away'),sc=played(g),lv=isLive(g),ko=isKO(g),ar=AR[g.arena];
  const stage=ko?stageLab(g):t().pool;
  const per=['1','2','3','OT'],pc=(tt,p)=>g.goals.filter(x=>x.t===tt&&x.p===p).length;
  const hasEv=g.goals.length||g.pens.length;
  const periods=sc&&hasEv&&g.home&&g.away?`<div class="card scroll"><table><tr><th>${t().team}</th>${per.map(p=>`<th class="n">${p}</th>`).join('')}<th class="n">${t().tot}</th></tr>${[g.home,g.away].map(x=>`<tr><td class="team">${esc(tn(x))}</td>${per.map(p=>`<td class="n">${pc(x,p)}</td>`).join('')}<td class="n"><b>${g.score[x===g.home?'home':'away']}</b></td></tr>`).join('')}</table></div>`:'';
  const goals=g.goals.length?`<div class="card">${g.goals.map(x=>`<div class="ev"><div class="tt">P${esc(x.p)} ${esc(x.time)}</div>${lg(x.t,30)}<div><b>${esc(P[x.s])}</b> · ${esc(tn(x.t))}<small>${x.a.length?t().assists+x.a.map(i=>esc(P[i])).join(', '):t().unassisted}</small></div></div>`).join('')}</div>`:`<div class="card empty"><b>${sc?t().noScoring:t().noGoals}</b>${sc?t().scoreNoDet:t().goalsLater}</div>`;
  const inf=s=>LANG==='fr'?(INF[s]||INF[String(s).replace(/[’´`�]/g,"'")]||s):s;
  const pens=g.pens.length?`<div class="card">${g.pens.map(x=>`<div class="ev"><div class="tt">P${esc(x.p)} ${esc(x.time)}</div>${lg(x.t,30)}<div><b>${esc(P[x.pl])}</b> · ${esc(tn(x.t))}<small>${esc(inf(x.inf))}, ${x.min} min</small></div></div>`).join('')}</div>`:`<div class="card empty"><b>${sc?t().noPens:t().noPensYet}</b>${t().penTip}</div>`;
  const lineup=tt=>{const l=g.lineup.filter(x=>x.t===tt).sort((a,b)=>a.no-b.no);return `<div class="card"><div style="padding:10px 14px 0"><h3>${esc(tn(tt))}</h3></div>${l.length?`<ul class="ros">${l.map(x=>`<li><b>#${x.no}</b>${esc(P[x.pl])}<span>${x.pos}</span></li>`).join('')}</ul>`:`<div class="empty">${t().lineupNo}</div>`}</div>`};
  const fmt=ko?t().fmtKO:t().fmtPool;
  const map=ar?mapUrl(ar):'';
  const idx=G.findIndex(x=>x.n===n),pv=G[idx-1],nx=G[idx+1];
  const homeLab=g.home?t().homeL:'',awayLab=g.away?t().awayL:'';
  return `<a class="back" href="#schedule">${t().backSched}</a>
  <div class="board"><div class="meta"><span>${stage} · ${t().gameWord} ${g.n}</span><span>${dd(g.start).dow} ${dd(g.start).md} · ${tm(g.start)}</span></div>
  <div class="vs"><div class="tn">${h.id?`<span class="lgw">${lg(h.id,52)}</span>`:''}<div>${esc(h.name)}</div><small>${homeLab||(h.hint?esc(h.hint):'')}</small></div><div class="big ${sc||lv?'':'tbd'}">${sc||lv?`${g.score.home} – ${g.score.away}`:'vs'}</div><div class="tn r">${a.id?`<span class="lgw">${lg(a.id,52)}</span>`:''}<div>${esc(a.name)}</div><small>${awayLab||(a.hint?esc(a.hint):'')}</small></div></div>${lv?`<div class="livebar"><i></i>${esc(liveLab(g))}${g.live&&g.live.lastEventAt?`<small>${t().lastEv} ${esc(g.live.lastEventAt)}</small>`:''}</div>`:''}</div>
  <div class="card facts" style="margin-top:16px">
    <div class="fact"><b>${t().fStatus}</b>${esc(lv?liveLab(g):stLab(g.status))}</div>
    <div class="fact"><b>${t().fPuck}</b>${tm(g.start)}${t().timeTo}${tm(g.end)}</div>
    <div class="fact"><b>${t().fArena}</b>${ar?`${esc(ar.name)}, ${esc(ar.rink)}<br><a href="${map}" target="_blank" rel="noopener">${esc(ar.address)}, ${esc(ar.city)} ↗</a>`:t().tbd}</div>
    ${spUrl(g)||g.sheet?`<div class="fact"><b>Spordle</b>${spUrl(g)?`<a href="${spUrl(g)}" target="_blank" rel="noopener">${t().openSp}</a>`:''}${spUrl(g)&&g.sheet?'<br>':''}${g.sheet?`<a href="${esc(g.sheet)}" target="_blank" rel="noopener">${t().openSheet}</a>`:''}</div>`:''}
    <div class="fact"><b>${t().fTimeline}</b>${t().tl(tmShift(g.start,-30),tmShift(g.start,-45),tmShift(g.start,-15))}</div>
  </div>
  ${periods?`<h2>${t().byPeriod}</h2>${periods}`:''}
  <h2>${t().scoring}</h2>${goals}<h2>${t().penalties}</h2>${pens}
  ${g.home&&g.away?`<h2>${t().lineups}</h2><div class="grid2">${lineup(g.home)}${lineup(g.away)}</div>`:''}
  <h2>${t().gameRules}</h2><div class="note" style="margin-top:0">${fmt}${t().fmtAll}</div>
  <div style="display:flex;justify-content:space-between;gap:12px;margin-top:22px;flex-wrap:wrap">${pv?`<a href="${link(pv)}">← ${t().gameWord} ${pv.n}</a>`:'<span></span>'}${nx?`<a href="${link(nx)}">${t().gameWord} ${nx.n} →</a>`:''}</div>`;
}
function rulesView(){
  const li=a=>`<ul style="margin:0;padding-left:20px;display:grid;gap:6px">${a.map(x=>`<li>${x}</li>`).join('')}</ul>`;
  return `<h2>${t().rulesTitle} <small>${t().rulesSub}</small></h2><div class="note" style="margin-top:0;margin-bottom:20px"><b>${t().offDoc}</b> <a href="https://page.spordle.com/tournoi-provincial-hockey-feminin-laval/documents/1f1d8a62-5b61-6970-bc78-0effd66aae45" target="_blank" rel="noopener">${t().offLink}</a>${t().offTail}</div><div class="grid2">${t().rules.map((x,i)=>i===2&&D.key==='A'?t().koRulesA:x).map(([h,a])=>`<div class="card" style="padding:16px"><h3>${h}</h3>${li(a)}</div>`).join('')}</div>`;
}
function notFound(){return `<div class="card empty"><b>${t().notFound}</b><a href="#overview">${t().backOv}</a></div>`}
/* ---------- render ---------- */
function chrome(){
  document.documentElement.lang=LANG;
  $('eb').textContent=t().eyebrow;
  $('cats').innerHTML=ALL.cats.map(c=>`<a href="?c=${c.key}"${c.key===D.key?' aria-current="page"':''}>${c.label}</a>`).join('');
  const a0=dd(D.start),a1=dd(D.end);
  $('sub').innerHTML=`<span>${a0.md}${t().to}${a1.md}, 2026</span><a href="${mapUrl(Object.values(AR)[0])}" target="_blank" rel="noopener" style="color:inherit">Aréna Martin St-Louis, Laval ↗</a><span>${t().games(G.length)} · ${t().teams(Object.keys(T).length)}</span>`;
  $('foot').textContent=t().foot(D.name,G.length,Object.keys(T).length);
}
function route(keepScroll){
  chrome();
  const h=(location.hash||'#overview').slice(1);let v='overview',html;
  const m=h.match(/^(game|team)-([0-9a-z]+)$/);
  if(m){v=m[1]==='game'?'schedule':'overview';html=m[1]==='game'?gameView(+m[2]):teamView(m[2])}
  else if(h==='schedule'){v=h;html=schedule()}
  else if(h==='stats'){v=h;html=statsView()}
  else if(h==='rules'){v=h;html=rulesView()}
  else html=overview();
  $('view').innerHTML=html;
  const tabs=Object.entries(t().tabs).map(([k,l])=>`<a href="#${k}" ${k===v?'aria-current="page"':''}>${l}</a>`).join('');
  $('tabs').innerHTML=tabs+`<button type="button" class="lang" id="lang" aria-label="${t().selLabel}" lang="${LANG==='fr'?'en':'fr'}">${t().sel}</button><button type="button" class="share" id="share" aria-label="${t().shareLabel}">${t().share}</button>`;
  $('share').onclick=async()=>{
    const url=location.href.split('#')[0].split('?')[0]+'?c='+D.key,b=$('share'),old=b.textContent;
    try{if(navigator.share){await navigator.share({title:document.title,text:t().shareText,url});return}}catch(e){if(e&&e.name==='AbortError')return}
    let ok=false;
    try{await navigator.clipboard.writeText(url);ok=true}catch(e){
      try{const ta=document.createElement('textarea');ta.value=url;document.body.appendChild(ta);ta.select();ok=document.execCommand('copy');ta.remove()}catch(e2){}}
    if(ok){b.textContent=t().copied;setTimeout(()=>{b.textContent=old},2000)}else{window.prompt&&window.prompt(t().shareLabel,url)}
  };
  $('lang').onclick=()=>{LANG=LANG==='fr'?'en':'fr';try{localStorage.setItem('laval-lang',LANG)}catch(e){}route(true)};
  const sp=$('strip');if(sp&&sp.querySelector){const n=sp.querySelector('.next');if(n)sp.scrollLeft=n.offsetLeft-sp.offsetLeft-(sp.clientWidth-n.offsetWidth)/2}
  if(h==='schedule')fillSched();
  if(h==='stats')fillPlayers();
  if(keepScroll!==true)window.scrollTo(0,0);
}
(()=>{const root=$('view');if(!root||!root.addEventListener)return;
  const on=e=>{const m=e.target.closest&&e.target.closest('.mu[data-pos]');if(!m)return;const ks=m.dataset.pos.split(' ');
    document.querySelectorAll('tr[data-pos]').forEach(r=>r.classList.toggle('hl',ks.includes(r.dataset.pos)))};
  const off=()=>document.querySelectorAll('tr.hl').forEach(r=>r.classList.remove('hl'));
  root.addEventListener('mouseover',on);root.addEventListener('focusin',on);
  root.addEventListener('mouseout',e=>{const n=e.relatedTarget;if(!n||!n.closest||!n.closest('.mu'))off()});
  root.addEventListener('focusout',off);
})();
